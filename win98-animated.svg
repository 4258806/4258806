<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520">
  <!-- 桌面背景 -->
  <rect x="0" y="0" width="880" height="520" fill="#008080"/>

  <!-- ===== 桌面图标 ===== -->
  <text x="24" y="56" font-family="Tahoma, sans-serif" font-size="36">💻</text>
  <text x="14" y="80" font-family="Tahoma, sans-serif" font-size="12" fill="#ffffff">我的电脑</text>
  <text x="24" y="136" font-family="Tahoma, sans-serif" font-size="36">🗑️</text>
  <text x="20" y="160" font-family="Tahoma, sans-serif" font-size="12" fill="#ffffff">回收站</text>
  <text x="24" y="216" font-family="Tahoma, sans-serif" font-size="36">📁</text>
  <text x="14" y="240" font-family="Tahoma, sans-serif" font-size="12" fill="#ffffff">我的文档</text>
  <text x="24" y="296" font-family="Tahoma, sans-serif" font-size="36">🌐</text>
  <text x="20" y="320" font-family="Tahoma, sans-serif" font-size="12" fill="#ffffff">浏览器</text>
  <text x="24" y="376" font-family="Tahoma, sans-serif" font-size="36">📝</text>
  <text x="20" y="400" font-family="Tahoma, sans-serif" font-size="12" fill="#ffffff">记事本</text>

  <!-- ===== 主窗口 ===== -->
  <rect x="130" y="24" width="620" height="420" fill="#c0c0c0"/>
  <rect x="130" y="24" width="620" height="420" fill="none" stroke="#dfdfdf" stroke-width="3"/>
  <rect x="133" y="27" width="614" height="414" fill="none" stroke="#808080" stroke-width="1"/>

  <!-- 标题栏 -->
  <rect x="136" y="30" width="608" height="28" fill="#000080"/>
  <text x="146" y="49" font-family="Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">💻 曾经的少年 - 个人主页</text>
  <rect x="668" y="34" width="20" height="18" fill="#c0c0c0" stroke="#dfdfdf" stroke-width="1"/>
  <text x="672" y="48" font-family="sans-serif" font-size="12" fill="#000000">▁</text>
  <rect x="692" y="34" width="20" height="18" fill="#c0c0c0" stroke="#dfdfdf" stroke-width="1"/>
  <text x="696" y="48" font-family="sans-serif" font-size="12" fill="#000000">□</text>
  <rect x="716" y="34" width="20" height="18" fill="#c0c0c0" stroke="#dfdfdf" stroke-width="1"/>
  <text x="720" y="48" font-family="sans-serif" font-size="12" fill="#000000">✕</text>

  <!-- 菜单栏 -->
  <text x="146" y="78" font-family="Tahoma, sans-serif" font-size="13" fill="#000000">文件(F)  编辑(E)  查看(V)  帮助(H)</text>
  <line x1="136" y1="86" x2="744" y2="86" stroke="#808080" stroke-width="1"/>
  <line x1="136" y1="87" x2="744" y2="87" stroke="#ffffff" stroke-width="1"/>

  <!-- 内容 -->
  <text x="150" y="122" font-family="Tahoma, sans-serif" font-size="18" font-weight="bold" fill="#000000">你好，我是曾经的少年 👋</text>
  <text x="150" y="154" font-family="Tahoma, sans-serif" font-size="14" fill="#000000">爱折腾 VPS 和 Oracle Cloud 的打工仔。</text>
  <text x="150" y="182" font-family="Tahoma, sans-serif" font-size="14" fill="#000000">📍 昆明，云南</text>

  <line x1="150" y1="202" x2="730" y2="202" stroke="#808080" stroke-width="1"/>
  <line x1="150" y1="203" x2="730" y2="203" stroke="#ffffff" stroke-width="1"/>

  <text x="150" y="232" font-family="Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#000000">🛠️ 正在折腾</text>
  <text x="150" y="260" font-family="Tahoma, sans-serif" font-size="14" fill="#000000">• Oracle Cloud 免费实例 / 抢机脚本</text>
  <text x="150" y="286" font-family="Tahoma, sans-serif" font-size="14" fill="#000000">• VPS 线路测试与保活</text>
  <text x="150" y="312" font-family="Tahoma, sans-serif" font-size="14" fill="#000000">• Python / Shell / Linux</text>

  <line x1="150" y1="332" x2="730" y2="332" stroke="#808080" stroke-width="1"/>
  <line x1="150" y1="333" x2="730" y2="333" stroke="#ffffff" stroke-width="1"/>

  <!-- 动态：加载进度条 -->
  <text x="150" y="360" font-family="Tahoma, sans-serif" font-size="13" fill="#000000">正在加载个人主页...</text>
  <rect x="150" y="370" width="300" height="18" fill="#ffffff" stroke="#808080" stroke-width="1"/>
  <rect x="151" y="371" width="0" height="16" fill="#000080">
    <animate attributeName="width" values="0;298;298;0" dur="5s" repeatCount="indefinite"/>
  </rect>
  <!-- 动态：闪烁光标 -->
  <text x="460" y="385" font-family="Tahoma, sans-serif" font-size="14" fill="#000000">C:\&gt;_</text>
  <rect x="508" y="372" width="9" height="15" fill="#000000">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="150" y="420" font-family="Tahoma, sans-serif" font-size="13" fill="#404040">提示：点左下角“开始”可以打开更多内容</text>

  <!-- ===== 任务栏 ===== -->
  <rect x="0" y="480" width="880" height="40" fill="#c0c0c0"/>
  <line x1="0" y1="480" x2="880" y2="480" stroke="#ffffff" stroke-width="1"/>
  <line x1="0" y1="481" x2="880" y2="481" stroke="#dfdfdf" stroke-width="1"/>
  <rect x="8" y="488" width="86" height="26" fill="#c0c0c0" stroke="#dfdfdf" stroke-width="2"/>
  <text x="18" y="506" font-family="Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#000000">🪟 开始</text>
  <rect x="104" y="488" width="180" height="26" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
  <text x="112" y="506" font-family="Tahoma, sans-serif" font-size="13" fill="#000000">💻 曾经的少年 - 个人主页</text>
  <!-- 时钟（冒号闪烁） -->
  <rect x="780" y="488" width="90" height="26" fill="#c0c0c0" stroke="#dfdfdf" stroke-width="1"/>
  <text x="792" y="506" font-family="Tahoma, sans-serif" font-size="13" fill="#000000">🕐 23<tspan><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>:</tspan>29</text>
</svg>
