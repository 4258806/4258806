<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520">
  <defs>
    <!-- 天空渐变 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a7bd5"/>
      <stop offset="100%" stop-color="#a8d0f0"/>
    </linearGradient>
    <!-- 标题栏渐变 -->
    <linearGradient id="titleBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0058e6"/>
      <stop offset="50%" stop-color="#3a93ff"/>
      <stop offset="100%" stop-color="#0058e6"/>
    </linearGradient>
    <!-- 任务栏渐变 -->
    <linearGradient id="taskbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f8cf3"/>
      <stop offset="50%" stop-color="#245edb"/>
      <stop offset="100%" stop-color="#3f8cf3"/>
    </linearGradient>
    <!-- 开始按钮渐变 -->
    <linearGradient id="startBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5cb85c"/>
      <stop offset="50%" stop-color="#3d9c3d"/>
      <stop offset="100%" stop-color="#2e7d2e"/>
    </linearGradient>
  </defs>

  <!-- ===== 壁纸：蓝天 ===== -->
  <rect x="0" y="0" width="880" height="520" fill="url(#sky)"/>

  <!-- 动态：飘动的云 -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="-200 0; 900 0" dur="80s" repeatCount="indefinite"/>
    <ellipse cx="150" cy="80" rx="70" ry="22" fill="#ffffff"/>
    <ellipse cx="200" cy="70" rx="55" ry="20" fill="#ffffff"/>
    <ellipse cx="110" cy="72" rx="45" ry="16" fill="#ffffff"/>
    <ellipse cx="600" cy="130" rx="80" ry="24" fill="#ffffff"/>
    <ellipse cx="660" cy="118" rx="60" ry="20" fill="#ffffff"/>
  </g>
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="-300 0; 900 0" dur="120s" repeatCount="indefinite"/>
    <ellipse cx="350" cy="180" rx="60" ry="18" fill="#ffffff"/>
    <ellipse cx="400" cy="170" rx="45" ry="16" fill="#ffffff"/>
    <ellipse cx="750" cy="60" rx="55" ry="18" fill="#ffffff"/>
  </g>

  <!-- 壁纸：绿色山丘 -->
  <path d="M0,400 Q220,330 440,380 T880,360 L880,520 L0,520 Z" fill="#5a9e2f"/>
  <path d="M0,430 Q280,370 550,410 T880,400 L880,520 L0,520 Z" fill="#4a8a26"/>

  <!-- ===== 桌面图标 ===== -->
  <text x="24" y="56" font-family="Tahoma, sans-serif" font-size="36">💻</text>
  <text x="14" y="80" font-family="Tahoma, sans-serif" font-size="12" fill="#ffffff">我的电脑</text>
  <text x="24" y="136" font-family="Tahoma, sans-serif" font-size="36">🗑️</text>
  <text x="20" y="160" font-family="Tahoma, sans-serif" font-size="12" fill="#ffffff">回收站</text>
  <text x="24" y="216" font-family="Tahoma, sans-serif" font-size="36">📁</text>
  <text x="14" y="240" font-family="Tahoma, sans-serif" font-size="12" fill="#ffffff">我的文档</text>
  <text x="24" y="296" font-family="Tahoma, sans-serif" font-size="36">🌐</text>
  <text x="20" y="320" font-family="Tahoma, sans-serif" font-size="12" fill="#ffffff">浏览器</text>

  <!-- ===== XP 窗口 ===== -->
  <rect x="130" y="24" width="620" height="420" rx="8" fill="#ece9d8" stroke="#0855dd" stroke-width="2"/>
  <!-- 标题栏 -->
  <rect x="132" y="26" width="616" height="30" rx="8" fill="url(#titleBar)"/>
  <rect x="132" y="46" width="616" height="10" fill="url(#titleBar)"/>
  <text x="146" y="46" font-family="Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">💻 曾经的少年 - 个人主页</text>
  <!-- 标题栏按钮 -->
  <rect x="664" y="30" width="22" height="20" rx="3" fill="#3a93ff" stroke="#ffffff" stroke-width="1"/>
  <text x="669" y="45" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">_</text>
  <rect x="690" y="30" width="22" height="20" rx="3" fill="#3a93ff" stroke="#ffffff" stroke-width="1"/>
  <text x="695" y="45" font-family="sans-serif" font-size="12" fill="#ffffff">▢</text>
  <rect x="716" y="30" width="22" height="20" rx="3" fill="#e81123" stroke="#ffffff" stroke-width="1"/>
  <text x="721" y="45" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">×</text>

  <!-- 菜单栏 -->
  <text x="146" y="78" font-family="Tahoma, sans-serif" font-size="13" fill="#000000">文件(F)  编辑(E)  查看(V)  收藏(A)  工具(T)  帮助(H)</text>
  <line x1="136" y1="86" x2="744" y2="86" stroke="#d4d0c8" stroke-width="1"/>

  <!-- 内容 -->
  <text x="150" y="122" font-family="Tahoma, sans-serif" font-size="18" font-weight="bold" fill="#000000">你好，我是曾经的少年 👋</text>
  <text x="150" y="154" font-family="Tahoma, sans-serif" font-size="14" fill="#000000">爱折腾 VPS 和 Oracle Cloud 的打工仔。</text>
  <text x="150" y="182" font-family="Tahoma, sans-serif" font-size="14" fill="#000000">📍 昆明，云南</text>

  <line x1="150" y1="202" x2="730" y2="202" stroke="#d4d0c8" stroke-width="1"/>

  <text x="150" y="232" font-family="Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#000000">🛠️ 正在折腾</text>
  <text x="150" y="260" font-family="Tahoma, sans-serif" font-size="14" fill="#000000">• Oracle Cloud 免费实例 / 抢机脚本</text>
  <text x="150" y="286" font-family="Tahoma, sans-serif" font-size="14" fill="#000000">• VPS 线路测试与保活</text>
  <text x="150" y="312" font-family="Tahoma, sans-serif" font-size="14" fill="#000000">• Python / Shell / Linux</text>

  <line x1="150" y1="332" x2="730" y2="332" stroke="#d4d0c8" stroke-width="1"/>

  <!-- 动态：加载进度条 -->
  <text x="150" y="360" font-family="Tahoma, sans-serif" font-size="13" fill="#000000">正在加载个人主页...</text>
  <rect x="150" y="370" width="300" height="18" fill="#ffffff" stroke="#7f9db9" stroke-width="1"/>
  <rect x="151" y="371" width="0" height="16" fill="#3a93ff">
    <animate attributeName="width" values="0;298;298;0" dur="5s" repeatCount="indefinite"/>
  </rect>
  <!-- 动态：闪烁光标 -->
  <text x="460" y="385" font-family="Tahoma, sans-serif" font-size="14" fill="#000000">C:\&gt;_</text>
  <rect x="508" y="372" width="9" height="15" fill="#000000">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="150" y="420" font-family="Tahoma, sans-serif" font-size="13" fill="#606060">提示：点左下角“开始”可以打开更多内容</text>

  <!-- ===== XP 任务栏 ===== -->
  <rect x="0" y="480" width="880" height="40" fill="url(#taskbar)"/>
  <!-- 开始按钮 -->
  <rect x="4" y="483" width="92" height="34" rx="8" fill="url(#startBtn)"/>
  <rect x="4" y="483" width="92" height="34" rx="8" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <!-- Windows 标志（四色方块） -->
  <rect x="12" y="492" width="9" height="8" fill="#f65314"/>
  <rect x="22" y="492" width="9" height="8" fill="#7cbb00"/>
  <rect x="12" y="501" width="9" height="8" fill="#00a1f1"/>
  <rect x="22" y="501" width="9" height="8" fill="#ffbb00"/>
  <text x="36" y="506" font-family="Tahoma, sans-serif" font-size="15" font-weight="bold" font-style="italic" fill="#ffffff">开始</text>
  <!-- 任务栏窗口按钮 -->
  <rect x="106" y="486" width="190" height="28" rx="4" fill="#3a93ff" stroke="#1e5cb8" stroke-width="1"/>
  <text x="116" y="505" font-family="Tahoma, sans-serif" font-size="13" fill="#ffffff">💻 曾经的少年 - 个人主页</text>
  <!-- 时钟（冒号闪烁） -->
  <rect x="790" y="486" width="84" height="28" rx="4" fill="#1290e9" stroke="#1e5cb8" stroke-width="1"/>
  <text x="800" y="505" font-family="Tahoma, sans-serif" font-size="13" fill="#ffffff">23<tspan><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>:</tspan>31</text>
</svg>
